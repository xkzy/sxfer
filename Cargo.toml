[package]
name = "sxfer"
version = "2.1.1"
edition = "2021"
authors = ["khing"]
description = "High-speed, one-way serial file tree transfer using fast-lzma2, RaptorQ fountain coding, and baseband line coding"

[dependencies]
lzma-rs = "0.3"
ring = "0.17"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
serialport = { version = "4.0", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
